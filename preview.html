<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#07111f" />
  <title>Large diagram preview | Mermaid Code</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23181818'/%3E%3Cpath d='M12 19 28 11v9l18-7 6 6v26l-6 6-18-7v9l-16-8-6-9V28z' fill='%2368217a' stroke='%23b07cff' stroke-width='3'/%3E%3Cpath d='m20 27 11 5 12-7v14l-12-7-11 5z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/preview.css" />
</head>
<body>
  <main class="fullscreen-preview" id="fullscreenPreview">
    <div class="preview-toolbar" aria-label="Diagram view tools">
      <a class="tool-button back-button" href="/" aria-label="Back to editor" title="Back to editor">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h10"/></svg>
        <span>Back to editor</span>
      </a>
      <div class="toolbar-group">
        <button class="tool-button" id="zoomOutButton" type="button" aria-label="Zoom out" title="Zoom out">−</button>
        <button class="zoom-label" id="zoomLabel" type="button" title="Fit to screen">100%</button>
        <button class="tool-button" id="zoomInButton" type="button" aria-label="Zoom in" title="Zoom in">+</button>
      </div>
    </div>

    <div class="diagram-stage" id="diagramStage">
      <div class="loading" id="loadingState"><span></span><p>Loading diagram…</p></div>
      <div class="diagram" id="diagramOutput" role="img" aria-label="Expanded Mermaid diagram"></div>
      <div class="empty-state" id="emptyState" hidden>
        <strong>No diagram to display</strong>
        <p>Enter code in the editor, then open this view again.</p>
        <a href="/">Back to editor</a>
      </div>
    </div>
  </main>
  <script type="module" src="/preview.js"></script>
</body>
</html>
